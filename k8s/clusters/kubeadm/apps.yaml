apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  # Real cluster: pulls the image from a registry. Set your registry in
  # k8s/app/overlays/registry/kustomization.yaml and push the image first.
  path: ./k8s/app/overlays/registry
  prune: true
  wait: true
  dependsOn:
    - name: infra-config
    - name: infra-kyverno
  sourceRef:
    kind: GitRepository
    name: flux-system
