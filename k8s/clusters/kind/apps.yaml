apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/app/overlays/kind
  prune: true
  wait: true
  dependsOn:
    - name: infra-config
    - name: infra-kyverno
  sourceRef:
    kind: GitRepository
    name: flux-system
